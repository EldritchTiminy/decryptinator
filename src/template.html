<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Decryptor</title>
  </head>
  <body>
    <div id="content">
      <div id="pageHeaderCont">
        <div id="pageHeader">
          DECRYPTOR
        </div>
      </div>
      
      <div id="decFormCont">
        <form id="decForm">
          <label class="keyIn" for="keyIn">Decryption Key</label>
          <input class="keyIn" type="text" id="keyIn"></input>
          <label class="texIn" for="texIn">Encrypted Text</label>
          <textarea class="texIn" id="texIn"></textarea>
          <button type="button" id="decBtn">Decrypt</button>
          <button type="button" id="encBtn">Encrypt</button>
        </form>
      </div>
      
      <div id="output">
        <div class="outHeader">
          <p id="outHeader">Output</p>
        </div>
        <div class="texOut">
          <p id="texOut"></p>
        </div>
      </div>
    </div>
  </body>
</html>
